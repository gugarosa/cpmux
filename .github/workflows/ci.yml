name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check dist/*
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          wheel="$(realpath dist/*.whl)"
          cd "$(mktemp -d)"
          uv run --no-project --with "$wheel" python -c \
            "from importlib.metadata import version; import cpmux; assert cpmux.__version__ == version('cpmux')"
          uv run --no-project --with "$wheel" cpmux --help
