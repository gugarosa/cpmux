[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmux"
version = "0.0.1"
description = "Multiplexer for GitHub Copilot CLI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Gustavo de Rosa" }]
keywords = ["copilot", "cli", "tmux", "multiplexer", "agents", "orchestration", "worktree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "click>=8.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = ["sounddevice>=0.4", "faster-whisper>=1.0"]

[project.scripts]
cmux = "cmux.ui.cli:main"

[project.urls]
Homepage = "https://github.com/gugarosa/cmux"
Repository = "https://github.com/gugarosa/cmux"

[tool.hatch.build.targets.wheel]
packages = ["cmux"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
