[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmux"
version = "0.0.1"
description = "Multiplexer for GitHub Copilot CLI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Gustavo de Rosa" }]
keywords = ["copilot", "cli", "tmux", "multiplexer", "agents", "orchestration", "worktree"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = ["sounddevice>=0.4", "foundry-local-sdk>=0.4", "httpx>=0.27"]

[project.scripts]
cmux = "cmux.ui.cli:main"

[project.urls]
Homepage = "https://github.com/gugarosa/cmux"
Repository = "https://github.com/gugarosa/cmux"

[tool.hatch.build.targets.wheel]
packages = ["cmux"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
